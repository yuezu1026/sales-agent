# 本地网关层（模拟服务器外层 nginx）：
# 结构与服务器 /etc/nginx/sites-enabled 完全一致，仅 proxy_pass 目标改为 compose 服务名
# 本地默认纯 HTTP；服务器 HTTPS 配置见 nginx.ssl.conf（由 docker-compose.prod.yml 覆盖启用）
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 前端应用：剥离 /app/ 前缀转发到 frontend 容器（与服务器一致）
    location /app/ {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 营销首页（本地占位页，对应服务器 /var/www/sales-agent）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
