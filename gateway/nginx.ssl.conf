# ============================================================
# 服务器 HTTPS 配置（腾讯云 SSL 证书）
# 由 docker-compose.prod.yml 以只读挂载覆盖 /etc/nginx/conf.d/default.conf 启用
# 证书文件（prod override 挂载到容器内 /etc/nginx/certs/）：
#   ./certs/fullchain.pem → /etc/nginx/certs/fullchain.pem  （= 腾讯云 xxx_bundle.pem）
#   ./certs/privkey.pem   → /etc/nginx/certs/privkey.pem    （= 腾讯云 xxx.key）
# 证书安装：./scripts/setup-cert.sh <腾讯云nginx包目录>
# ============================================================

# ── HTTP：一律 301 跳转 HTTPS ────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：TLS 终结 + 前端应用 + API 代理 ───────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name sales-agent.top;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 前端应用：剥离 /app/ 前缀转发到 frontend 容器
    location /app/ {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 营销首页（对应服务器 /var/www/sales-agent）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
