# AI智能获客助手 MVP - 一键部署
# 用法：cp .env.example .env && 编辑 .env → docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: aic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_customer}
      POSTGRES_USER: ${DB_USER:-ai_customer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_customer}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_customer}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: aic-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ai_customer}
      DB_USER: ${DB_USER:-ai_customer}
      DB_PASSWORD: ${DB_PASSWORD:-ai_customer}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      JWT_SECRET: ${JWT_SECRET:-ai-customer-dev-secret-change-me-in-prod-0123456789}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-720}
      CONFIG_ENC_KEY: ${CONFIG_ENC_KEY:-change-me-32bytes-encryption-key!!}
      EMAIL_SYNC_CRON: ${EMAIL_SYNC_CRON:-*/15 * * * * *}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: aic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

  # 网关层：模拟服务器外层 nginx（/app/ 剥离前缀、/api/ 转发、/ 营销首页），
  # 使本地 Docker 结构与服务器完全一致。本地默认纯 HTTP（80）；
  # 服务器 HTTPS（腾讯云证书）用 docker-compose.prod.yml 覆盖启用（见 FAQ 8）
  gateway:
    build: ./gateway
    container_name: aic-gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
