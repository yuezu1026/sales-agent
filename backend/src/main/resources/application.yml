server:
  port: 8080

spring:
  application:
    name: ai-customer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_customer}
    username: ${DB_USER:ai_customer}
    password: ${DB_PASSWORD:ai_customer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ${AI_PROVIDER:openai}
    openai:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
    # MCP Server：Streamable HTTP 暴露 /mcp 端点，@McpTool 注解工具自动注册
    mcp:
      server:
        protocol: STREAMABLE
        type: SYNC

app:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 覆盖（至少 32 字节）
    secret: ${JWT_SECRET:ai-customer-dev-secret-change-me-in-prod-0123456789}
    # 登录有效期（小时），默认 720 = 30 天，可被 JWT_EXPIRE_HOURS 覆盖
    expire-hours: ${JWT_EXPIRE_HOURS:720}
  config:
    # 敏感配置加密密钥（AES-256），生产必须通过 CONFIG_ENC_KEY 覆盖
    enc-key: ${CONFIG_ENC_KEY:change-me-32bytes-encryption-key!!}
  # 邮箱收件（M2-1.6）：MCP 协议抓取客户回复邮件
  # provider 判定（M7.7）：不设置 EMAIL_PROVIDER 时，按系统设置 imap.host 自动判定——
  # 系统设置配置了 imap.host → imap（真实邮箱）；未配置 → mock（内置模拟邮件）。
  # 如需强制某模式可用环境变量 EMAIL_PROVIDER=imap|mock 显式覆盖。
  email:
    provider: ${EMAIL_PROVIDER:}
    # MCP Client 自连本服务 /mcp 端点（Streamable HTTP）
    mcp-server-url: ${EMAIL_MCP_URL:http://localhost:8080/mcp}
    # 定时同步 cron（默认每 15 秒；真实 IMAP 下不宜过频以免邮箱服务商限流），留空则仅手动触发
    sync-cron: ${EMAIL_SYNC_CRON:*/15 * * * * *}
    # 以下 IMAP 参数为环境变量兜底（可选）：M7.7 起优先读系统设置 imap.* 配置
    imap:
      host: ${IMAP_HOST:}
      port: ${IMAP_PORT:993}
      ssl: ${IMAP_SSL:true}
      username: ${IMAP_USERNAME:}
      password: ${IMAP_PASSWORD:}

logging:
  level:
    com.aicustomer: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
