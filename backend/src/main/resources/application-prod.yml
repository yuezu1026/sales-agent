# 生产环境配置（--spring.profiles.active=prod 启用）
# 敏感项全部来自环境变量（docker-compose 注入），本文件只做环境差异覆盖

server:
  port: 8080
  shutdown: graceful

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  file:
    name: logs/ai-customer.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
  level:
    com.aicustomer: info
    org.hibernate.SQL: warn
