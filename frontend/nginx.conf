server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（M8.2）：本地直连容器时也有压缩；生产走外层 nginx 同样开启
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端路由（React Router 需要回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 入口禁止缓存：每次发版后客户端必须重新拉取，
    # 否则手机浏览器会启发式缓存旧 index.html → 引用旧 bundle → 新功能不可见
    # no-store（最强）：国内手机浏览器（微信/夸克/UC 等）对 no-cache 的 revalidate 约束力不足，
    # 普通导航（重新打开链接）会直接命中启发式缓存的旧条目而不发请求 → 必须 no-store 强制不缓存
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 带 hash 的静态资源长缓存（文件名变化即失效）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
